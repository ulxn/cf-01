<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes.</title>
<meta name="description" content="my notes app.">
<meta name="theme-color" content="#f4f4f4">
<meta property="og:title" content="Notes.">
<meta property="og:description" content="my notes app.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23444'/%3E%3Crect x='4' y='5' width='8' height='1.4' fill='%23fff'/%3E%3Crect x='4' y='8' width='8' height='1.4' fill='%23fff'/%3E%3Crect x='4' y='11' width='5' height='1.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="css/style.css" as="style">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 class="logo">Notes.</h1>
  <button id="themeToggle" class="btn btn-ghost" aria-label="Toggle theme">
    <span class="theme-icon">🌙</span>
  </button>
</header>

<main class="wrap">
  <section class="composer">
    <input id="noteInput" class="input" type="text" maxlength="100" placeholder="Write a note...">
    <button id="addBtn" class="btn btn-primary">
      <span class="btn-label">Add</span>
      <span class="spinner" hidden></span>
    </button>
  </section>
  <div class="counter"><span id="charCount">0</span> / 100</div>

  <section aria-live="polite">
    <div id="emptyState" class="empty">No notes yet — add your first one above.</div>
    <ul id="notesList" class="notes-list"></ul>
  </section>
</main>

<footer class="footer">
  <p>
    © <span id="year"></span>
    <a href="https://github.com/ulxn/cf-01" class="footer-link" target="_blank" rel="noopener noreferrer">
      ulxn's Notes
    </a>
    • v1.1.1 · Cloudflare Workers + D1
  </p>
</footer>

<div id="editModal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h2 id="editTitle" class="modal-title">Edit note</h2>
    <textarea id="editInput" class="textarea" maxlength="100" rows="4"></textarea>
    <div class="counter"><span id="editCharCount">0</span> / 100</div>
    <div class="modal-actions">
      <button id="editCancel" class="btn btn-ghost">Cancel</button>
      <button id="editSave" class="btn btn-primary">
        <span class="btn-label">Save</span>
        <span class="spinner" hidden></span>
      </button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle" class="modal-title">Delete this note?</h2>
    <p class="modal-body">This can't be undone.</p>
    <div class="modal-actions">
      <button id="confirmCancel" class="btn btn-ghost">Cancel</button>
      <button id="confirmDelete" class="btn btn-danger">
        <span class="btn-label">Delete</span>
        <span class="spinner" hidden></span>
      </button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
